name: Artifactory Automation
description: Automates the updating of Chainguard pull tokens and authentication for an Artifactory repository.

inputs:
  # String inputs
  identity:
    description: 'Github assumable identity to Chainguard'
    required: true
  
  organization:
    description: 'Chainguard Organization Name'
    required: true

  cloudsmith_url:
    description: 'The URL to your Cloudsmith instance'
    required: true

  cloudsmith_org_name:
    description: 'The name of your Cloudsmith organization'
    required: true
  
  cloudsmith_repository_name:
    description: 'The name of your Cloudsmith repository'
    required: true
  
  cloudsmith_upstream_name:
    description: 'The name of the Docker upstream in Cloudsmith (used to look up its slug_perm)'
    required: true

  cloudsmith_user:
    description: 'The username for Cloudsmith'
    required: true
  

  cloudsmith_token:
    description: 'Cloudsmith API token for deployment'
    required: true

  ttl:
    description: 'TTL for the token ex: 1h (default is 7 days)'
    required: false
    default: 168h

  prune_expired:
    description: 'Prune expired Cloudsmith tokens (requires identity.list, identity.delete permissions)'
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: "Auth"
      uses: chainguard-dev/setup-chainctl@272698817627c158bbd813cb783b62a4b9bbbc67
      with:
        identity: ${{ inputs.identity }}

    - name: Create Token
      shell: bash
      id: create_token
      env:
        ORGANIZATION: ${{ inputs.organization }}
        TTL: ${{ inputs.ttl }}
        PRUNE: ${{ inputs.prune_expired }}
        TOKEN_NAME: docker-cloudsmith-${{ inputs.cloudsmith_repository_name }}-${{ inputs.cloudsmith_upstream_name }}
      run: |
        if [[ "$PRUNE" = "true" ]]; then
          for id in $(chainctl iam identities list --parent "$ORGANIZATION" --name "$TOKEN_NAME" --expired -o json | jq -r '.items[]?.id'); do
            [[ -n "$id" ]] || continue
            echo "Deleting old pull token $id"
            chainctl iam identities delete "$id" --parent "$ORGANIZATION" -y
          done
        fi

        PULL_TOKEN_JSON=$(chainctl auth pull-token --ttl "$TTL" --output json --parent "$ORGANIZATION" --name "$TOKEN_NAME")

        user=$(jq -r '.identity_id' <<<"$PULL_TOKEN_JSON")
        password=$(jq -r '.token' <<<"$PULL_TOKEN_JSON")
        echo "::add-mask::$password"

        echo "user=$user" >> "$GITHUB_OUTPUT"
        echo "password=$password" >> "$GITHUB_OUTPUT"

    - name: Update Cloudsmith Registry
      shell: bash
      id: update-cloudsmith
      env:
        TOKEN_USER: ${{ steps.create_token.outputs.user }}
        TOKEN_PASSWORD: ${{ steps.create_token.outputs.password }}
        CLOUDSMITH_USER: ${{ inputs.cloudsmith_user }}
        CLOUDSMITH_API_KEY: ${{ inputs.cloudsmith_token }}
        CLOUDSMITH_URL: ${{ inputs.cloudsmith_url }}
        CLOUDSMITH_ORG_NAME: ${{ inputs.cloudsmith_org_name }}
        CLOUDSMITH_REPOSITORY_NAME: ${{ inputs.cloudsmith_repository_name }}
        CLOUDSMITH_UPSTREAM_NAME: ${{ inputs.cloudsmith_upstream_name }}
      run: |
        # Look up the upstream's slug_perm by name
        SLUG_PERM=$(curl --silent --fail \
             --request GET \
             --url "https://api.cloudsmith.io/v1/repos/$CLOUDSMITH_ORG_NAME/$CLOUDSMITH_REPOSITORY_NAME/upstream/docker/?page_size=100" \
             --header "accept: application/json" \
             --header @<(printf 'X-Api-Key: %s\n' "$CLOUDSMITH_API_KEY") \
          | jq -r --arg name "$CLOUDSMITH_UPSTREAM_NAME" '.[] | select(.name == $name) | .slug_perm')

        if [[ -z "$SLUG_PERM" ]]; then
          echo "Error: no Docker upstream named '$CLOUDSMITH_UPSTREAM_NAME' found"
          exit 1
        fi

        # Update the upstream with the new pull token
        # Secrets are read from env and sent via stdin / fd so they never appear in the process list
        RESP=$(jq -n '{
                 "auth_secret": env.TOKEN_PASSWORD,
                 "auth_username": env.TOKEN_USER,
                 "name": env.CLOUDSMITH_UPSTREAM_NAME,
                 "upstream_url": "https://cgr.dev"
               }' \
          | curl --silent --write-out "HTTPSTATUS:%{http_code}" \git pu
             --request PUT \
             --url "https://api.cloudsmith.io/v1/repos/$CLOUDSMITH_ORG_NAME/$CLOUDSMITH_REPOSITORY_NAME/upstream/docker/$SLUG_PERM/" \
             --header "accept: application/json" \
             --header "content-type: application/json" \
             --header @<(printf 'X-Api-Key: %s\n' "$CLOUDSMITH_API_KEY") \
             --data @-)

        BODY=$(echo "$RESP" | sed -e 's/HTTPSTATUS\:.*//g')
        STATUS=$(echo "$RESP" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')

        if [[ "$STATUS" != '200' ]]; then
          echo "Error ${STATUS}: $BODY"
          exit 1
        fi

        echo "Upstream '$CLOUDSMITH_UPSTREAM_NAME' updated"