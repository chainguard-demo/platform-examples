name: Rotate Cloudsmith Pull Token

on:
  workflow_dispatch:
  # Uncomment to rotate automatically (weekly, Sunday 00:00 UTC).
  # Keep the schedule shorter than the token ttl.
  # schedule:
  #   - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  rotate:
    name: Rotate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: "Update Cloudsmith Upstream Token"
        uses: <where-your-action-lives>
        with:
          identity: "some-chainguard/assumable-identity"
          organization: test.com
          cloudsmith_url: https://api.cloudsmith.io
          cloudsmith_org_name: your-cloudsmith-org
          cloudsmith_repository_name: your-cloudsmith-repo
          cloudsmith_upstream_name: your-docker-upstream
          cloudsmith_user: your-cloudsmith-user
          cloudsmith_token: ${{ secrets.CLOUDSMITH_API_KEY }}
          prune_expired: true
