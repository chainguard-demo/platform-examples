name: build

on:
  pull_request:

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - aws-auth
          - github-issue-opener
          - image-copy-ecr
          - image-copy-gcp
          - image-diff
          - jira-issue-opener
          - slack-webhook
          - tag-history

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.image }}/go.mod

      - uses: ko-build/setup-ko@3aebd0597dc1e9d1a26bcfdb7cbeb19c131d3037 # v0.7
      - uses: chainguard-dev/actions/setup-registry@3e8a2a226fad9e1ecbf2d359b8a7697554a4ac6d # main

      - working-directory: ${{ matrix.image }}
        run: |
          KO_DOCKER_REPO=localhost:1338/test ko build --image-refs=ko.images --bare .
          echo "KO build $(cat ko.images)"
